[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histok"
version = "0.1.0"
description = "HistoK - 조선시대 역사 스토리텔링 AI 시스템"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.2.1",
    "pandas==2.3.3",
    "langchain-core==1.0.5",
    "psycopg2-binary==2.9.11",
    "pgvector==0.3.5",
    "langchain==1.0.7",
    "langchain-community==0.4.1",
    "langchain-openai==1.0.3",
    "langgraph==1.0.3",
    "langgraph-cli[inmem]==0.4.7",
    "langsmith==0.4.46",
    "langchain-text-splitters",
    "SPARQLWrapper==2.0.0",
    "rdflib==7.0.0",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pymilvus==2.6.4",
    "sentence-transformers==5.1.2",
    "torch==2.9.1",
    "transformers==4.57.3",
    "kiwipiepy==0.18.0",
    "google-genai==1.52.0",
    "google-generativeai==0.8.5",
    "pillow==12.0.0",
    "fal-client==0.9.1",
    "requests==2.32.5",
    "django==5.2.8",
    "django-allauth==65.13.1",
    "neo4j==5.18.0",
    "openai>=1.109.1,<3.0.0",
    "jupyter==1.1.1",
    "accelerate==0.27.2",
    "tqdm==4.66.5",
    "djangorestframework==3.15.1",
    "djangorestframework-simplejwt==5.3.1",
    "django-cors-headers==4.3.1",
    "django-redis==5.4.0",
    "deep_translator==1.11.4",
    "drf-spectacular==0.29.0",
    "click>=8.0.0",
    "ragas==0.2.15",
]

[project.scripts]
pgvector_load = "backend.db_pipeline.vectordb.cli:cli"
ontology = "backend.langgraph_fuseki.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.langgraph_fuseki" = [
    "ontology/instances/*.ttl",
    "ontology/instances/*.json",
]
"backend.inference_engine" = [
    "rules/*.rules",
    "reasoner/**/*.java",
]
