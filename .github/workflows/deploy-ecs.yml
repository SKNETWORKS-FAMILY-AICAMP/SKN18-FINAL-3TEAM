name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - web
          - celery
          - all
        default: 'all'

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 533124807326.dkr.ecr.ap-northeast-2.amazonaws.com
  ECS_CLUSTER: skn18-3-dev-cluster

jobs:
  deploy-web:
    name: Deploy Web Service
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.service == 'web' || github.event.inputs.service == 'all' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Web image to Amazon ECR
        env:
          ECR_REPOSITORY: skn18-3-dev-web
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Web Docker image..."
          docker build -t $ECR_REPOSITORY:latest -f backend/Dockerfile .
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Pushing Web image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT

      - name: Force new deployment for Web service
        run: |
          echo "Triggering new deployment for Web service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service skn18-3-dev-web \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for Web service to be stable
        run: |
          echo "Waiting for Web service to stabilize..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services skn18-3-dev-web \
            --region $AWS_REGION
          echo "✓ Web service deployment completed"

  deploy-celery:
    name: Deploy Celery Service
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.service == 'celery' || github.event.inputs.service == 'all' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Celery image to Amazon ECR
        env:
          ECR_REPOSITORY: skn18-3-dev-web
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Celery Docker image (same as Web)..."
          docker build -t $ECR_REPOSITORY:latest -f backend/Dockerfile .
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Pushing Celery image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT

      - name: Force new deployment for Celery service
        run: |
          echo "Triggering new deployment for Celery service..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service skn18-3-dev-celery \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for Celery service to be stable
        run: |
          echo "Waiting for Celery service to stabilize..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services skn18-3-dev-celery \
            --region $AWS_REGION
          echo "✓ Celery service deployment completed"

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-web, deploy-celery]
    if: always()

    steps:
      - name: Check deployment status
        run: |
          echo "Deployment Summary:"
          echo "==================="
          echo "Service: ${{ github.event.inputs.service }}"
          echo "Web deployment: ${{ needs.deploy-web.result }}"
          echo "Celery deployment: ${{ needs.deploy-celery.result }}"

          if [[ "${{ needs.deploy-web.result }}" == "failure" ]] || [[ "${{ needs.deploy-celery.result }}" == "failure" ]]; then
            echo "❌ Deployment failed"
            exit 1
          else
            echo "✅ Deployment successful"
          fi
