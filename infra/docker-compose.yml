services:
  # Fuseki
  fuseki:
    image: stain/jena-fuseki:latest
    platform: linux/amd64 # Windows/Mac (Intel/Apple Silicon) 호환
    container_name: fuseki
    restart: unless-stopped
    env_file:
      - ../.env # 프로젝트 루트의 .env 파일 사용
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD:-fuseki1234}
      - JVM_ARGS=-Xmx2g -Xms1g # 메모리 설정 (선택 사항)
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki # Named volume (권장)
      - ./knowledge_engineering:/knowledge_engineering:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Neo4j
  neo4j:
    image: neo4j:5.18
    container_name: neo4j-joseon_ver1.2
    ports:
      - "7474:7474" # 웹 UI
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/skn183final # 비번은 알아서 바꿔도 됨
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import

  # PostgreSQL
  postgres:
    image: pgvector/pgvector:pg16 # PostgreSQL 16 + pgvector 확장 기능 포함 이미지
    platform: linux/amd64 # Windows/Mac (Intel/Apple Silicon) 호환
    container_name: postgres_pgvector # 컨테이너 이름
    restart: always # 컨테이너 비정상 종료 시 항상 재시작

    environment:
      # PostgreSQL 기본 계정 정보 (.env 파일의 환경변수 사용)
      POSTGRES_USER: ${POSTGRES_USER:-root} # PostgreSQL 접속 사용자 이름
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root1234} # PostgreSQL 접속 비밀번호
      POSTGRES_DB: ${POSTGRES_DB:-skn18final} # 기본으로 생성할 데이터베이스 이름

    ports:
      - "5432:5432" # 호스트 포트:컨테이너 포트 (기본 PostgreSQL 포트 5432)

    volumes:
      # PostgreSQL 데이터 영속화 (named volume 사용으로 권한 문제 해결)
      - postgres-data:/var/lib/postgresql/data
      # 초기화 SQL 스크립트 실행
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d skn18final"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (캐싱 전용 - 블랙리스트는 PostgreSQL 사용)
  redis:
    image: redis:7-alpine # 경량 Alpine 이미지
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379" # 기본 Redis 포트
    volumes:
      - redis-data:/data # 데이터 영속화
    command: redis-server --appendonly yes # AOF 영속성 활성화
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  web:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: django_web
    env_file:
      - ../.env
    environment:
      # Docker 환경에서 Fuseki 서비스 이름으로 접근
      - FUSEKI_URL=http://fuseki:3030/korean-history
      - DOCKER_ENV=true
    command:
      [
        "/app/backend/django/entrypoint.sh",
        "python",
        "manage.py",
        "runserver",
        "0.0.0.0:8000",
      ]
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
    depends_on:
      - postgres
      - redis
      - neo4j
      - fuseki

volumes:
  fuseki-data:
    driver: local
  postgres-data:
    name: sknfinal_postgres-data
    driver: local
  redis-data:
    driver: local
