AWSTemplateFormatVersion: "2010-09-09"
Description: "Base ECS stack: ECS cluster, task roles, log group, service discovery namespace (reuses existing ECR repos)."

Parameters:
  NamePrefix:
    Type: String
    Default: skn18-3-dev
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1,3,5,7,14,30,60,90,180,365,400,545,731,1827,3653]
  ServiceDiscoveryNamespace:
    Type: String
    Default: skn18.local

Resources:
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${NamePrefix}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${NamePrefix}"
      RetentionInDays: !Ref LogRetentionDays

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub "${NamePrefix}-ssm-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ "ssm:GetParameters" ]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/*"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  ServiceDiscoveryNamespaceResource:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref ServiceDiscoveryNamespace
      Vpc: !ImportValue
        Fn::Sub: "${NamePrefix}-vpc-id"

Outputs:
  EcsClusterName:
    Value: !Ref EcsCluster
    Export:
      Name: !Sub "${NamePrefix}-ecs-cluster-name"
  EcsClusterArn:
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub "${NamePrefix}-ecs-cluster-arn"
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub "${NamePrefix}-ecs-execution-role-arn"
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub "${NamePrefix}-ecs-task-role-arn"
  LogGroupName:
    Value: !Ref EcsLogGroup
    Export:
      Name: !Sub "${NamePrefix}-ecs-log-group"
  ServiceDiscoveryNamespaceId:
    Value: !Ref ServiceDiscoveryNamespaceResource
    Export:
      Name: !Sub "${NamePrefix}-sd-namespace-id"
  WebRepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${NamePrefix}-web"
    Export:
      Name: !Sub "${NamePrefix}-web-repo-uri"
  PostgresRepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${NamePrefix}-postgres"
    Export:
      Name: !Sub "${NamePrefix}-postgres-repo-uri"
  Neo4jRepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${NamePrefix}-neo4j"
    Export:
      Name: !Sub "${NamePrefix}-neo4j-repo-uri"
  FusekiRepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${NamePrefix}-fuseki"
    Export:
      Name: !Sub "${NamePrefix}-fuseki-repo-uri"
  RedisRepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${NamePrefix}-redis"
    Export:
      Name: !Sub "${NamePrefix}-redis-repo-uri"
